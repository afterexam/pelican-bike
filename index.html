<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑行 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe8ff}
  #app{width:100%;height:100%}
  #tip{position:fixed;left:12px;bottom:12px;color:#33597a;font:14px/1.4 system-ui,sans-serif;background:rgba(255,255,255,.6);padding:6px 10px;border-radius:8px}
  #err{position:fixed;inset:0;display:none;place-items:center;color:#a33;font:16px system-ui,sans-serif}
</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app"></div>
<div id="tip">拖动旋转 · 滚轮缩放</div>
<div id="err">3D 模块没加载出来，检查网络后刷新试试</div>
<script>window.addEventListener('error',e=>{const el=document.getElementById('err');if(e.message&&el&&!window.__ok){el.style.display='grid'}},true);</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
window.__ok=true;

const W=()=>window.innerWidth, H=()=>window.innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W(),H());
document.getElementById('app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xaee2ff);
scene.fog=new THREE.Fog(0xaee2ff,60,160);

const camera=new THREE.PerspectiveCamera(45,W()/H(),.1,300);
camera.position.set(10,5.5,14);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2,0);
controls.enableDamping=true;
controls.autoRotate=true;
controls.autoRotateSpeed=.8;
controls.minDistance=6; controls.maxDistance=40;
controls.maxPolarAngle=Math.PI*.52;

scene.add(new THREE.HemisphereLight(0xffffff,0x77a05a,1.0));
const sunL=new THREE.DirectionalLight(0xfff2cc,1.6);
sunL.position.set(-18,25,10);
scene.add(sunL);

const M=(c,o={})=>new THREE.MeshLambertMaterial({color:c,...o});

// ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),M(0x7ec850));
ground.rotation.x=-Math.PI/2; scene.add(ground);

// road along X
const road=new THREE.Mesh(new THREE.PlaneGeometry(400,4.2),M(0x4a4a52));
road.rotation.x=-Math.PI/2; road.position.y=.02; scene.add(road);
const dashes=new THREE.Group();
for(let i=-24;i<=24;i++){
  const d=new THREE.Mesh(new THREE.BoxGeometry(1.6,.02,.22),M(0xffffff));
  d.position.set(i*3.2,.03,0); dashes.add(d);
}
scene.add(dashes);

// mountains
function mountain(x,z,r,h,c){
  const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,7),M(c)); m.position.y=h/2; g.add(m);
  const cap=new THREE.Mesh(new THREE.ConeGeometry(r*.42,h*.28,7),M(0xffffff));
  cap.position.y=h-h*.13; g.add(cap);
  g.position.set(x,0,z); scene.add(g);
}
mountain(-38,-45,14,20,0x6f8f6a); mountain(-12,-55,18,26,0x5f7f60);
mountain(18,-50,12,17,0x6f8f6a); mountain(45,-58,16,23,0x5f7f60);
mountain(70,-48,10,14,0x6f8f6a);

// clouds
const clouds=[];
function cloud(x,y,z){
  const g=new THREE.Group();
  for(let i=0;i<4;i++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(1.6-Math.abs(i-1.5)*.35,12,10),M(0xffffff));
    s.position.set(i*1.6-2.4,Math.random()*.4,0); g.add(s);
  }
  g.position.set(x,y,z); scene.add(g); clouds.push(g);
}
cloud(-20,14,-18); cloud(6,17,-26); cloud(28,12,-14); cloud(-4,20,-38);

// sun
const sun=new THREE.Mesh(new THREE.SphereGeometry(3,24,18),new THREE.MeshBasicMaterial({color:0xffd75e}));
sun.position.set(-28,24,-40); scene.add(sun);

// bike + pelican
const rig=new THREE.Group(); rig.position.set(0,0,0); scene.add(rig);
const red=M(0xd23b2e), dark=M(0x22262b);

function tube(a,b,r,mat){
  const d=new THREE.Vector3().subVectors(b,a);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),10),mat);
  m.position.copy(a).addScaledVector(d,.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
  return m;
}
const wheelZ=1.15, wheelR=.62;
function wheel(z){
  const g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.TorusGeometry(wheelR,.07,10,28),dark); g.add(t);
  for(let i=0;i<8;i++){
    const s=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,wheelR*2,6),M(0x9aa2ab));
    s.rotation.z=i*Math.PI/8; g.add(s);
  }
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.16,8),M(0x9aa2ab));
  hub.rotation.x=Math.PI/2; g.add(hub);
  g.rotation.y=Math.PI/2; g.position.set(0,wheelR,z);
  g.userData.spin=t; return g;
}
const wF=wheel(wheelZ), wB=wheel(-wheelZ); rig.add(wF,wB);

const BB=new THREE.Vector3(0,wheelR,0), BF=new THREE.Vector3(0,wheelR,wheelZ), BBk=new THREE.Vector3(0,wheelR,-wheelZ);
const bb=new THREE.Vector3(0,1.15,0);                       // bottom bracket
const seat=new THREE.Vector3(-.28,1.62,-.42);               // saddle
const hb=new THREE.Vector3(.32,1.72,.62);                   // handlebar
rig.add(tube(bb,BBk,.045,red), tube(bb,seat,.045,red), tube(BBk,seat,.04,red));
rig.add(tube(bb,hb,.045,red), tube(new THREE.Vector3(0,1.15,.62),hb,.04,red));
rig.add(tube(new THREE.Vector3(0,1.15,-.62),seat,.04,red));
const saddle=new THREE.Mesh(new THREE.BoxGeometry(.34,.07,.16),dark); saddle.position.copy(seat); rig.add(saddle);
const bar=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.5,8),dark);
bar.rotation.z=Math.PI/2; bar.position.set(0,hb.y+.06,.62); rig.add(bar);

// crank + pedals + feet
const crankR=.24, crank=new THREE.Group(); crank.position.copy(bb); rig.add(crank);
crank.add(new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.03,12),dark));
const cr1=new THREE.Mesh(new THREE.BoxGeometry(.05,.5,.04),red); cr1.position.y=0; crank.add(cr1);
const cr2=cr1.clone(); cr2.rotation.z=Math.PI; crank.add(cr2);
const p1=new THREE.Mesh(new THREE.BoxGeometry(.16,.03,.09),dark); p1.position.set(0,.25,.1); crank.add(p1);
const p2=p1.clone(); p2.position.set(0,-.25,-.1); crank.add(p2);

// pelican
const pel=new THREE.Group(); rig.add(pel);
const hip=new THREE.Vector3(-.22,1.78,-.40);   // on saddle
const bodyC=new THREE.Vector3(-.35,2.35,-.25);
const body=new THREE.Mesh(new THREE.SphereGeometry(.55,20,16),M(0xf7f7f2));
body.scale.set(1,.92,1.25); body.position.copy(bodyC); pel.add(body);
const tail=new THREE.Mesh(new THREE.ConeGeometry(.22,.6,10),M(0xf7f7f2));
tail.position.set(-.85,2.42,-.3); tail.rotation.z=Math.PI/2+.35; pel.add(tail);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(.13,.17,.75,12),M(0xf7f7f2));
neck.position.set(-.05,3.0,-.05); neck.rotation.z=-.15; pel.add(neck);
const head=new THREE.Mesh(new THREE.SphereGeometry(.24,16,12),M(0xf7f7f2));
head.position.set(.02,3.42,-.02); pel.add(head);
const beak=new THREE.Mesh(new THREE.ConeGeometry(.09,.55,10),M(0xf59e2d));
beak.position.set(.42,3.4,.02); beak.rotation.z=-Math.PI/2; pel.add(beak);
for(const s of [-1,1]){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),M(0x1a1a1a));
  eye.position.set(.12,3.47,s*.17); pel.add(eye);
}
const wings=[];
for(const s of [-1,1]){
  const w=new THREE.Mesh(new THREE.SphereGeometry(.34,14,10),M(0xefefe8));
  w.scale.set(1.15,.5,.75); w.position.set(-.35,2.4,s*.55);
  pel.add(w); wings.push(w);
}
// legs
const legMat=M(0xf59e2d);
const legs=[-1,1].map(s=>{
  const g=new THREE.Group();
  const thigh=new THREE.Mesh(new THREE.CylinderGeometry(.05,.045,.5,8),legMat); g.add(thigh);
  const shin=new THREE.Mesh(new THREE.CylinderGeometry(.04,.035,.5,8),legMat); g.add(shin);
  const foot=new THREE.Mesh(new THREE.BoxGeometry(.16,.04,.26),legMat); g.add(foot);
  rig.add(g); return {g,thigh,shin,foot,side:s};
});

function placeLeg(L,p0,pk,pf){
  // thigh from hip to knee
  const d1=new THREE.Vector3().subVectors(pk,p0);
  L.thigh.position.copy(p0).addScaledVector(d1,.5);
  L.thigh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d1.clone().normalize());
  // shin from knee to foot
  const d2=new THREE.Vector3().subVectors(pf,pk);
  L.shin.position.copy(pk).addScaledVector(d2,.5);
  L.shin.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d2.clone().normalize());
  L.foot.position.copy(pf);
}

let t=0;
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=clock.getDelta(); t+=dt;

  wF.children[0].rotation.x+=dt*5; wB.children[0].rotation.x+=dt*5;
  crank.rotation.x=t*3.4;

  // pedal world positions
  const ang=t*3.4;
  const ped1=new THREE.Vector3(0,Math.sin(ang)*crankR,Math.cos(ang)*crankR).add(bb);
  const ped2=new THREE.Vector3(0,-Math.sin(ang)*crankR,-Math.cos(ang)*crankR).add(bb);
  const kneeR=.5;
  [ped1,ped2].forEach((pf,i)=>{
    const L=legs[i];
    const p0=hip.clone(); p0.y-=.02;
    const mid=p0.clone().add(pf).multiplyScalar(.5);
    const dir=new THREE.Vector3().subVectors(pf,p0).normalize();
    const side=(i===0?1:-1);
    const pk=mid.clone().add(new THREE.Vector3(-.06,kneeR*0.55,0));
    pk.y=Math.max(mid.y+.1, wheelR+.15);
    placeLeg(L,p0,pk,pf);
  });

  // bobbing + wing flap + cloud drift + road dashes
  pel.position.y=Math.sin(t*3.4)*.03;
  pel.rotation.z=Math.sin(t*3.4)*.02;
  wings.forEach((w,i)=>{w.rotation.x=Math.sin(t*2.2+i)*.12});
  for(const d of dashes.children){
    d.position.x-=dt*5;
    if(d.position.x<-78) d.position.x+=156;
  }
  clouds.forEach((c,i)=>{c.position.x+=dt*(.4+i*.1); if(c.position.x>60)c.position.x=-60;});

  controls.update();
  renderer.render(scene,camera);
}
tick();

window.addEventListener('resize',()=>{
  camera.aspect=W()/H(); camera.updateProjectionMatrix();
  renderer.setSize(W(),H());
});
</script>
</body>
</html>
