<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑行 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe8ff}
  #app{width:100%;height:100%}
  #tip{position:fixed;left:12px;bottom:12px;color:#33597a;font:14px/1.4 system-ui,sans-serif;background:rgba(255,255,255,.6);padding:6px 10px;border-radius:8px}
  #err{position:fixed;inset:0;display:none;place-items:center;color:#a33;font:16px system-ui,sans-serif}
</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app"></div>
<div id="tip">拖动旋转 · 滚轮缩放</div>
<div id="err">3D 模块没加载出来，检查网络后刷新试试</div>
<script>window.addEventListener('error',e=>{const el=document.getElementById('err');if(e.message&&el&&!window.__ok){el.style.display='grid'}},true);</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
window.__ok=true;

const W=()=>window.innerWidth, H=()=>window.innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W(),H());
document.getElementById('app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xaee2ff);
scene.fog=new THREE.Fog(0xaee2ff,60,160);

const camera=new THREE.PerspectiveCamera(45,W()/H(),.1,300);
camera.position.set(5.5,3.2,9.5);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.9,0);
controls.enableDamping=true;
controls.autoRotate=true;
controls.autoRotateSpeed=.8;
controls.minDistance=6; controls.maxDistance=40;
controls.maxPolarAngle=Math.PI*.52;

scene.add(new THREE.HemisphereLight(0xffffff,0x77a05a,1.0));
const sunL=new THREE.DirectionalLight(0xfff2cc,1.6);
sunL.position.set(-18,25,10);
scene.add(sunL);

const M=(c,o={})=>new THREE.MeshLambertMaterial({color:c,...o});

// ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),M(0x7ec850));
ground.rotation.x=-Math.PI/2; scene.add(ground);

// road along X
const road=new THREE.Mesh(new THREE.PlaneGeometry(400,4.2),M(0x4a4a52));
road.rotation.x=-Math.PI/2; road.position.y=.02; scene.add(road);
const dashes=new THREE.Group();
for(let i=-24;i<=24;i++){
  const d=new THREE.Mesh(new THREE.BoxGeometry(1.6,.02,.22),M(0xffffff));
  d.position.set(i*3.2,.03,0); dashes.add(d);
}
scene.add(dashes);

// mountains
function mountain(x,z,r,h,c){
  const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,7),M(c)); m.position.y=h/2; g.add(m);
  const cap=new THREE.Mesh(new THREE.ConeGeometry(r*.42,h*.28,7),M(0xffffff));
  cap.position.y=h-h*.13; g.add(cap);
  g.position.set(x,0,z); scene.add(g);
}
mountain(-38,-45,14,20,0x6f8f6a); mountain(-12,-55,18,26,0x5f7f60);
mountain(18,-50,12,17,0x6f8f6a); mountain(45,-58,16,23,0x5f7f60);
mountain(70,-48,10,14,0x6f8f6a);

// clouds
const clouds=[];
function cloud(x,y,z){
  const g=new THREE.Group();
  for(let i=0;i<4;i++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(1.6-Math.abs(i-1.5)*.35,12,10),M(0xffffff));
    s.position.set(i*1.6-2.4,Math.random()*.4,0); g.add(s);
  }
  g.position.set(x,y,z); scene.add(g); clouds.push(g);
}
cloud(-20,14,-18); cloud(6,17,-26); cloud(28,12,-14); cloud(-4,20,-38);

// sun
const sun=new THREE.Mesh(new THREE.SphereGeometry(3,24,18),new THREE.MeshBasicMaterial({color:0xffd75e}));
sun.position.set(-28,24,-40); scene.add(sun);

// bike: faces +x (road dashes scroll toward -x, so it rides forward)
const rig=new THREE.Group(); scene.add(rig);
const red=M(0xd23b2e), dark=M(0x22262b);

function tube(a,b,r,mat){
  const d=new THREE.Vector3().subVectors(b,a);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),10),mat);
  m.position.copy(a).addScaledVector(d,.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
  return m;
}
const wheelR=.62;
function wheel(x){
  const g=new THREE.Group();
  const spin=new THREE.Group(); g.add(spin);
  const t=new THREE.Mesh(new THREE.TorusGeometry(wheelR,.07,10,28),dark); spin.add(t);
  for(let i=0;i<8;i++){
    const s=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,wheelR*2,6),M(0x9aa2ab));
    s.rotation.z=i*Math.PI/8; spin.add(s);
  }
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.16,8),M(0x9aa2ab));
  hub.rotation.x=Math.PI/2; spin.add(hub);
  g.rotation.y=Math.PI/2; g.position.set(x,wheelR,0);
  g.userData.spin=spin; return g;
}
const wF=wheel(1.15), wB=wheel(-1.15); rig.add(wF,wB);

const bb=new THREE.Vector3(0,1.08,0);
const seat=new THREE.Vector3(-.55,1.66,0);
const hb =new THREE.Vector3(.55,1.72,0);
rig.add(tube(bb,new THREE.Vector3(-1.15,wheelR,0),.055,red));
rig.add(tube(bb,seat,.055,red), tube(new THREE.Vector3(-1.15,wheelR,0),seat,.05,red));
rig.add(tube(bb,hb,.055,red), tube(new THREE.Vector3(.45,1.45,0),new THREE.Vector3(1.15,wheelR,0),.05,red));
rig.add(tube(new THREE.Vector3(-.55,1.5,0),seat,.05,red));
const saddle=new THREE.Mesh(new THREE.BoxGeometry(.44,.08,.2),dark); saddle.position.copy(seat); saddle.position.y-=.02; rig.add(saddle);
const bar=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.5,8),dark);
bar.rotation.x=Math.PI/2; bar.position.set(hb.x,hb.y+.06,0); rig.add(bar);

// crank + pedals
const crankR=.24, crank=new THREE.Group(); crank.position.copy(bb); rig.add(crank);
crank.add(new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.03,12),dark));
const cr1=new THREE.Mesh(new THREE.BoxGeometry(.05,.5,.04),red); crank.add(cr1);
const cr2=cr1.clone(); cr2.rotation.z=Math.PI; crank.add(cr2);
const p1=new THREE.Mesh(new THREE.BoxGeometry(.09,.03,.16),dark); p1.position.set(.1,.25,0); crank.add(p1);
const p2=p1.clone(); p2.position.set(-.1,-.25,0); crank.add(p2);

// pelican (bike local: +x forward)
const pel=new THREE.Group(); rig.add(pel);
const white=M(0xf7f7f2), cream=M(0xefefe8);
const orange=M(0xf59e2d), pouchM=M(0xf5b94a);

const body=new THREE.Mesh(new THREE.SphereGeometry(.55,20,16),white);
body.scale.set(1.18,.8,.95); body.position.set(-.42,1.97,0);
body.rotation.z=-.35; pel.add(body);

const tail=new THREE.Mesh(new THREE.ConeGeometry(.18,.55,10),cream);
tail.position.set(-1.05,2.2,0); tail.rotation.z=Math.PI/2+.5; pel.add(tail);

// neck: smooth tube along an S curve
const neckCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-.3,2.25,0),
  new THREE.Vector3(-.14,2.55,0),
  new THREE.Vector3(.0,2.76,0),
  new THREE.Vector3(.18,2.9,0),
  new THREE.Vector3(.3,2.97,0)
]);
pel.add(new THREE.Mesh(new THREE.TubeGeometry(neckCurve,24,.115,12),white));
const neckBase=new THREE.Mesh(new THREE.SphereGeometry(.17,12,10),white);
neckBase.position.set(-.3,2.25,0); pel.add(neckBase);

const head=new THREE.Mesh(new THREE.SphereGeometry(.23,16,12),white);
head.position.set(.32,2.98,0); pel.add(head);
// upper beak: long flat, tip slightly down
const beak=new THREE.Mesh(new THREE.SphereGeometry(.5,14,10),orange);
beak.scale.set(.85,.13,.18); beak.position.set(.75,2.97,0); beak.rotation.z=-.1; pel.add(beak);
// pouch
const pouch=new THREE.Mesh(new THREE.SphereGeometry(.5,14,10),pouchM);
pouch.scale.set(.62,.22,.14); pouch.position.set(.66,2.83,0); pel.add(pouch);
for(const s of [-1,1]){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),M(0x1a1a1a));
  eye.position.set(.4,3.06,s*.17); pel.add(eye);
}
// wings: folded along the body, reaching toward the bar
const wings=[];
for(const s of [-1,1]){
  const w=new THREE.Mesh(new THREE.SphereGeometry(.5,14,10),cream);
  w.scale.set(.95,.24,.34); w.position.set(-.1,2.1,s*.3);
  w.rotation.z=-.45; pel.add(w); wings.push(w);
}
// legs
const legs=[-1,1].map(s=>{
  const g=new THREE.Group();
  const thigh=new THREE.Mesh(new THREE.CylinderGeometry(.055,.05,.5,8),orange); g.add(thigh);
  const shin=new THREE.Mesh(new THREE.CylinderGeometry(.045,.04,.5,8),orange); g.add(shin);
  const foot=new THREE.Mesh(new THREE.BoxGeometry(.22,.04,.11),orange); g.add(foot);
  rig.add(g); return {g,thigh,shin,foot,side:s};
});

function placeSeg(mesh,a,b){
  const d=new THREE.Vector3().subVectors(b,a);
  mesh.position.copy(a).addScaledVector(d,.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
}

let t=0;
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=clock.getDelta(); t+=dt;

  wF.userData.spin.rotation.z+=dt*5; wB.userData.spin.rotation.z+=dt*5;
  crank.rotation.x=t*3.4;

  const ang=t*3.4;
  const ped1=new THREE.Vector3(Math.cos(ang)*crankR,Math.sin(ang)*crankR,0).add(bb);
  const ped2=new THREE.Vector3(-Math.cos(ang)*crankR,-Math.sin(ang)*crankR,0).add(bb);
  [ped1,ped2].forEach((pf,i)=>{
    const L=legs[i];
    const p0=new THREE.Vector3(-.46,1.66,L.side*.15);
    const mid=p0.clone().add(pf).multiplyScalar(.5);
    const pk=mid.clone().add(new THREE.Vector3(.16,.14,0));
    pk.y=Math.max(pk.y, wheelR+.12);
    placeSeg(L.thigh,p0,pk);
    placeSeg(L.shin,pk,pf);
    L.foot.position.copy(pf).add(new THREE.Vector3(0,.03,0));
  });

  pel.position.y=Math.sin(t*3.4)*.03;
  pel.rotation.z=Math.sin(t*3.4)*.02;
  wings.forEach((w,i)=>{w.rotation.x=Math.sin(t*2.2+i)*.12});
  for(const d of dashes.children){
    d.position.x-=dt*5;
    if(d.position.x<-78) d.position.x+=156;
  }
  clouds.forEach((c,i)=>{c.position.x+=dt*(.4+i*.1); if(c.position.x>60)c.position.x=-60;});

  controls.update();
  renderer.render(scene,camera);
}
tick();

window.addEventListener('resize',()=>{
  camera.aspect=W()/H(); camera.updateProjectionMatrix();
  renderer.setSize(W(),H());
});
</script>
</body>
</html>
